<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PDF to JPG Converter - Free Online Tool</title>
    <meta name="description" content="Free online PDF to JPG converter. Convert PDF pages into JPG images easily.">

    <!-- Google AdSense -->
    <script async
        src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4810150524509221"
        crossorigin="anonymous"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 20px;
            text-align: center;
        }

        .container {
            max-width: 700px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #222;
        }

        p {
            color: #555;
        }

        input {
            margin: 20px 0;
            padding: 10px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        #status {
            margin-top: 20px;
            font-weight: bold;
        }

        canvas {
            max-width: 100%;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>PDF to JPG Converter</h1>

    <p>Convert your PDF pages into JPG images quickly and easily.</p>

    <input type="file" id="pdfFile" accept="application/pdf">

    <br>

    <button onclick="convertPDF()">Convert PDF to JPG</button>

    <div id="status"></div>

    <div id="output"></div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    async function convertPDF() {

        const fileInput = document.getElementById("pdfFile");
        const status = document.getElementById("status");
        const output = document.getElementById("output");

        output.innerHTML = "";

        if (!fileInput.files.length) {
            status.innerText = "Please select a PDF file first.";
            return;
        }

        const file = fileInput.files[0];

        if (file.type !== "application/pdf") {
            status.innerText = "Please select a valid PDF file.";
            return;
        }

        status.innerText = "Converting...";

        try {

            const arrayBuffer = await file.arrayBuffer();

            const pdf = await pdfjsLib.getDocument({
                data: arrayBuffer
            }).promise;

            for (let pageNumber = 1; pageNumber <= pdf.numPages; pageNumber++) {

                const page = await pdf.getPage(pageNumber);

                const viewport = page.getViewport({
                    scale: 2
                });

                const canvas = document.createElement("canvas");

                const context = canvas.getContext("2d");

                canvas.width = viewport.width;
                canvas.height = viewport.height;

                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;

                const image = canvas.toDataURL("image/jpeg", 0.9);

                const link = document.createElement("a");

                link.href = image;
                link.download = "page-" + pageNumber + ".jpg";
                link.innerText = "Download Page " + pageNumber + " JPG";

                link.style.display = "block";
                link.style.margin = "15px";

                output.appendChild(canvas);
                output.appendChild(link);
            }

            status.innerText = "Conversion completed successfully!";

        } catch (error) {

            console.error(error);

            status.innerText =
                "Something went wrong. Please try another PDF file.";
        }
    }
</script>

</body>
</html>
